<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>نظام الجباية والتدقيق الرقمي - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                "colors": {
                        "primary-fixed": "#d5e3ff",
                        "on-tertiary-container": "#d8885c",
                        "on-primary-fixed-variant": "#1f477b",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e0e3e6",
                        "on-surface-variant": "#43474f",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb690",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary": "#381300",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "primary-container": "#003366",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#799dd6",
                        "background": "#f7f9fc",
                        "secondary-fixed": "#d6e3fe",
                        "tertiary-fixed": "#ffdbca",
                        "surface-container-low": "#f2f4f7",
                        "primary-fixed-dim": "#a7c8ff",
                        "inverse-primary": "#a7c8ff",
                        "secondary-container": "#d6e3fe",
                        "error": "#d32f2f",
                        "success": "#2e7d32",
                        "surface-container-high": "#e6e8eb",
                        "surface-dim": "#d8dadd",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eceef1",
                        "secondary": "#525f75",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e6",
                        "surface": "#f7f9fc",
                        "outline-variant": "#c3c6d1",
                        "outline": "#737780",
                        "tertiary-container": "#592300",
                        "surface-bright": "#f7f9fc",
                        "secondary-fixed-dim": "#bac7e1",
                        "on-tertiary-fixed": "#341100",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "surface-tint": "#3a5f94",
                        "on-tertiary-fixed-variant": "#723610",
                        "primary": "#001e40",
                        "on-primary-fixed": "#001b3c",
                        "on-secondary-fixed": "#0f1c2f",
                        "on-secondary-fixed-variant": "#3b475d",
                        "on-secondary-container": "#58657c"
                },
                "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                },
                "fontFamily": {
                        "headline": [
                                "Cairo", "Public Sans", "sans-serif"
                        ],
                        "body": [
                                "Cairo", "Public Sans", "sans-serif"
                        ],
                        "label": [
                                "Cairo", "Public Sans", "sans-serif"
                        ]
                }
            },
            },
          }
        </script>
    <style>
        body { font-family: 'Cairo', sans-serif; min-height: 100vh; margin: 0; }
        .glass-effect {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.7);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-surface text-on-surface flex flex-col items-center justify-center p-6 antialiased selection:bg-primary-container selection:text-white relative overflow-hidden">
    <!-- Background Animated Shapes -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-on-tertiary-container/5 blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <main class="w-full max-w-md flex flex-col relative z-10">
        <!-- Header Section -->
        <header class="flex flex-col items-center text-center mb-10 transform transition-all duration-700 ease-out translate-y-0 opacity-100" id="header">
            <div class="w-24 h-24 mb-6 rounded-3xl bg-surface-container-highest shadow-xl flex items-center justify-center transform hover:rotate-6 transition-transform duration-300">
                <span class="material-symbols-outlined text-5xl text-primary" data-icon="account_balance">account_balance</span>
            </div>
            <h1 class="text-4xl font-black text-primary tracking-tight mb-2 font-headline">نظام الجباية والتدقيق الرقمي</h1>
            <p class="text-on-surface-variant text-base font-semibold">إدارة الدائرة الثامنة عشر - قاطع جنوب الرصافة</p>
        </header>

        <!-- Login Form Container -->
        <section class="bg-surface-container-lowest rounded-2xl p-10 shadow-[0_32px_64px_-16px_rgba(0,30,64,0.12)] border border-white/40 w-full relative z-20 glass-effect">
            <form class="flex flex-col gap-6" id="loginForm">
                <!-- Username Input -->
                <div class="relative group">
                    <label class="sr-only" for="username">اسم المستخدم</label>
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                        <span class="material-symbols-outlined text-2xl" data-icon="person">person</span>
                    </div>
                    <input class="w-full bg-surface-container-highest/50 text-on-surface placeholder-on-surface-variant/50 border-2 border-transparent rounded-xl py-4 pr-14 pl-4 focus:ring-4 focus:ring-primary/10 focus:border-primary/20 focus:outline-none transition-all duration-300 font-medium" id="username" name="username" placeholder="اسم المستخدم" type="text" required/>
                </div>

                <!-- Password Input -->
                <div class="relative group">
                    <label class="sr-only" for="password">كلمة المرور</label>
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                        <span class="material-symbols-outlined text-2xl" data-icon="lock">lock</span>
                    </div>
                    <input class="w-full bg-surface-container-highest/50 text-on-surface placeholder-on-surface-variant/50 border-2 border-transparent rounded-xl py-4 pr-14 pl-14 focus:ring-4 focus:ring-primary/10 focus:border-primary/20 focus:outline-none transition-all duration-300 font-medium" id="password" name="password" placeholder="كلمة المرور" type="password" required/>
                    <button id="togglePassword" class="absolute inset-y-0 left-0 pl-4 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
                        <span class="material-symbols-outlined text-2xl" id="passwordIcon">visibility</span>
                    </button>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-5 h-5 rounded border-2 border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer">
                        <span class="text-sm font-semibold text-on-surface-variant group-hover:text-primary transition-colors">تذكرني</span>
                    </label>
                    <a href="#" class="text-sm font-bold text-primary hover:underline underline-offset-4">نسيت كلمة المرور؟</a>
                </div>

                <!-- Error Message Container (Hidden by default) -->
                <div id="errorContainer" class="hidden opacity-0 transform -translate-y-2 transition-all duration-300">
                    <div class="bg-error/5 border border-error/10 text-error px-4 py-3 rounded-xl flex items-center gap-3 shadow-inner">
                        <span class="material-symbols-outlined text-xl">error</span>
                        <p id="errorMessage" class="text-xs font-black tracking-tight"></p>
                    </div>
                </div>

                <!-- Action Button -->
                <button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary rounded-xl py-4 font-bold text-xl mt-2 transition-all duration-300 shadow-[0_12px_24px_-8px_rgba(0,30,64,0.4)] hover:shadow-[0_20px_40px_-12px_rgba(0,30,64,0.5)] transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2" type="submit">
                    <span>تسجيل الدخول للنظام</span>
                    <span class="material-symbols-outlined">login</span>
                </button>
            </form>
        </section>

        <!-- Footer Note -->
        <footer class="mt-12 text-center">
            <div class="inline-flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full mb-4">
                <span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
                <span class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">نظام آمن ومحمي</span>
            </div>
            <p class="text-on-surface-variant text-sm font-medium opacity-80 max-w-xs mx-auto leading-relaxed">
                هذا النظام مخصص حصراً للمخولين من إدارة الدائرة الثامنة عشر. جميع العمليات المسجلة تخضع للمراقبة والتدقيق.
            </p>
        </footer>
    </main>

    <script type="module">
        import { supabase } from './lib/supabase.js';

        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const passwordIcon = document.querySelector('#passwordIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        const form = document.querySelector('#loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            const username = form.username.value.trim(); 
            const pass = form.password.value;

            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span><span>جاري التحقق...</span>';
            
            try {
                // Determine if we should use the input directly or if it's a name
                let loginEmail = username;
                if (!username.includes('@')) {
                    // If they just typed 'ali', we try the known accounts
                    // But in a real system, the user should type their email.
                    // For convenience in this demo, let's map 'ali' to 'ali@ihsan.com'
                    if (username === 'ali' || username === 'علي احسان') {
                        loginEmail = 'ali@ihsan.com';
                    }
                }

                console.log('Attempting login for:', loginEmail);

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: loginEmail,
                    password: pass,
                });

                if (error) throw error;

                // Fetch profile details
                const { data: profile, error: pError } = await supabase
                    .from('profiles')
                    .select('role, full_name')
                    .eq('id', data.user.id)
                    .single();
                
                if (pError) {
                    console.warn('Profile fetch error:', pError);
                }

                // Security Check: Is the account deactivated?
                if (profile && (profile.full_name || '').startsWith('[DEACTIVATED]')) {
                    await supabase.auth.signOut();
                    throw new Error('تم تعطيل هذا الحساب أو حذفه من قبل الإدارة');
                }

                // Success
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-green-600');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>تم الدخول بنجاح</span>';

                // Store session info
                localStorage.setItem('userRole', profile?.role || 'ally');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (err) {
                console.error('Login Error:', err);
                btn.disabled = false;
                btn.innerHTML = originalText;
                
                let errorMsg = 'تأكد من اسم المستخدم أو كلمة المرور';
                if (err.message.includes('Email not confirmed')) errorMsg = 'يرجى تأكيد البريد الإلكتروني أولاً';
                else if (err.message === 'Invalid login credentials') errorMsg = 'كلمة المرور غير صحيحة أو الحساب غير مسجل';
                else if (err.message !== 'Invalid login credentials') errorMsg = err.message;

                const errorContainer = document.getElementById('errorContainer');
                const errorMessage = document.getElementById('errorMessage');
                
                errorMessage.textContent = errorMsg;
                errorContainer.classList.remove('hidden');
                
                // Animate entry
                setTimeout(() => {
                    errorContainer.classList.remove('opacity-0', '-translate-y-2');
                    errorContainer.classList.add('opacity-100', 'translate-y-0');
                    
                    // Shake effect
                    form.classList.add('animate-shake');
                    setTimeout(() => form.classList.remove('animate-shake'), 400);
                }, 10);
            }
        });

        // Hide error when user re-types
        form.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                const errorContainer = document.getElementById('errorContainer');
                if (!errorContainer.classList.contains('hidden')) {
                    errorContainer.classList.add('opacity-0', '-translate-y-2');
                    setTimeout(() => errorContainer.classList.add('hidden'), 300);
                }
            });
        });
    </script>
</body>
</html>
