<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>تسجيل الدخول - نظام الجباية</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="./lib/app-style.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="./lib/theme-config.js" type="module"></script>
</head>
<body class="bg-[#f8faff] text-[#1a1c1e] flex flex-col items-center justify-center p-6 antialiased overflow-hidden">
    
    <!-- Premium Backdrop -->
    <div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#f8faff] via-[#eef2f8] to-[#e4e9f2]">
        <div class="absolute top-0 right-0 w-full h-full opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 80% 20%, #0056b3 0%, transparent 40%);"></div>
    </div>

    <main class="w-full max-w-sm flex flex-col items-center animate-slide-up">
        <!-- Brand Header -->
        <header class="flex flex-col items-center text-center mb-10">
            <div class="mb-6 relative group">
                <div class="absolute -inset-4 bg-blue-500/10 blur-2xl rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
                <img src="assets/logo.png" alt="Logo" class="w-32 h-32 object-contain app-logo logo-floating relative z-10 drop-shadow-2xl">
            </div>
            <h1 class="text-3xl font-black text-[#0056b3] tracking-tight mb-1 font-headline">نظام المساهمات الرقمي</h1>
            <p class="text-[#44474e] text-sm font-bold opacity-70 italic">البنيان المرصوص - الدائرة 18</p>
        </header>

        <!-- Premium Login Card -->
        <section class="w-full bg-white rounded-[32px] p-8 shadow-[0_24px_48px_-12px_rgba(0,86,179,0.08)] border border-blue-50/50 relative overflow-hidden">
            <!-- Subtle Card Glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-100/30 blur-3xl rounded-full"></div>
            
            <form class="flex flex-col gap-5 relative z-10" id="loginForm">
                <!-- Username Input Group -->
                <div class="space-y-1.5">
                    <label class="text-xs font-black text-[#0056b3] mr-4 uppercase tracking-widest" for="username">اسم المستخدم</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-blue-900/40 group-focus-within:text-[#0056b3] transition-colors">
                            <span class="material-symbols-outlined text-2xl">person</span>
                        </div>
                        <input class="w-full bg-[#f8faff] text-[#1a1c1e] border-2 border-transparent rounded-[20px] py-4 pr-14 pl-4 focus:border-blue-200 focus:bg-white focus:ring-0 transition-all font-bold placeholder:font-normal placeholder:text-blue-900/20" id="username" name="username" placeholder="مثال: علي احسان" type="text" required/>
                    </div>
                </div>

                <!-- Password Input Group -->
                <div class="space-y-1.5">
                    <label class="text-xs font-black text-[#0056b3] mr-4 uppercase tracking-widest" for="password">كلمة المرور</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-blue-900/40 group-focus-within:text-[#0056b3] transition-colors">
                            <span class="material-symbols-outlined text-2xl">lock</span>
                        </div>
                        <input class="w-full bg-[#f8faff] text-[#1a1c1e] border-2 border-transparent rounded-[20px] py-4 pr-14 pl-14 focus:border-blue-200 focus:bg-white focus:ring-0 transition-all font-bold placeholder:font-normal placeholder:text-blue-900/20" id="password" name="password" placeholder="أدخل الرمز السري" type="password" required/>
                        <button id="togglePassword" class="absolute inset-y-0 left-0 pl-4 flex items-center text-blue-900/30 hover:text-[#0056b3] transition-colors py-2 px-1" type="button">
                            <span class="material-symbols-outlined text-22" id="passwordIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Error Container -->
                <div id="errorContainer" class="hidden animate-bounce-in">
                    <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-2xl flex items-center gap-3">
                        <span class="material-symbols-outlined text-xl">error_outline</span>
                        <p id="errorMessage" class="text-xs font-black"></p>
                    </div>
                </div>

                <!-- Action Button -->
                <button class="w-full bg-[#0056b3] text-white rounded-[20px] py-5 font-black text-lg mt-4 shadow-lg shadow-blue-700/20 active:scale-95 transition-all flex items-center justify-center gap-3 group" type="submit">
                    <span>دخول للنظام</span>
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">login</span>
                </button>
            </form>
        </section>

        <!-- App Footer Info -->
        <footer class="mt-10 flex flex-col items-center gap-3">
            <div class="flex items-center gap-2 bg-blue-100/50 px-4 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                <span class="text-[10px] font-black text-blue-800 uppercase tracking-tighter">نسخة آمنة - تشفير 256-بت</span>
            </div>
            <p class="text-[#44474e] text-[10px] font-bold opacity-60 text-center leading-relaxed px-6">
                هذا التطبيق مخصص لموظفي الدائرة الثامنة عشر فقط. جميع العمليات مسجلة للأغراض الرقابية.
            </p>
        </footer>
    </main>

    <script type="module">
        import { supabase } from './lib/supabase.js';

        // Auto-login check
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            window.location.href = 'dashboard.html';
        }

        const form = document.querySelector('#loginForm');
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const passwordIcon = document.querySelector('#passwordIcon');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');

        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            const username = form.username.value.trim(); 
            const pass = form.password.value;

            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span><span>جاري الدخول...</span>';
            errorContainer.classList.add('hidden');
            
            try {
                let loginEmail = username;
                if (!username.includes('@')) {
                    if (username === 'ali' || username === 'علي احسان') {
                        loginEmail = 'ali@ihsan.com';
                    }
                }

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: loginEmail,
                    password: pass,
                });

                if (error) throw error;

                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role, full_name')
                    .eq('id', data.user.id)
                    .single();
                
                if (profile && (profile.full_name || '').startsWith('[DEACTIVATED]')) {
                    await supabase.auth.signOut();
                    throw new Error('تم تعطيل هذا الحساب من قبل الإدارة');
                }

                btn.classList.replace('bg-[#0056b3]', 'bg-green-600');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>تم التحقق</span>';

                localStorage.setItem('userRole', profile?.role || 'ally');
                setTimeout(() => window.location.href = 'dashboard.html', 800);

            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                errorMessage.textContent = err.message === 'Invalid login credentials' 
                    ? 'خطأ في اسم المستخدم أو الرمز السري' 
                    : err.message;
                errorContainer.classList.remove('hidden');
            }
        });

        // Hide error when user re-types
        form.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                if (!errorContainer.classList.contains('hidden')) {
                    errorContainer.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
