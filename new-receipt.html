<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>تسجيل وصل - نظام المساهمات</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="./lib/app-style.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="./lib/theme-config.js" type="module"></script>
</head>
<body class="bg-[#f8faff] text-[#1a1c1e] min-h-screen flex flex-col font-body">

    <!-- Premium Native AppBar -->
    <header class="flex items-center justify-between px-5 pt-8 pb-4 sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-blue-50/50">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="w-10 h-10 flex items-center justify-center bg-blue-50 text-[#0056b3] rounded-xl active:scale-90 transition-all">
                <span class="material-symbols-outlined font-bold">arrow_forward</span>
            </a>
            <div>
                <h1 class="text-lg font-black text-[#0056b3] leading-none">تسجيل وصل</h1>
                <p class="text-[10px] font-bold text-blue-900/40 uppercase tracking-tighter mt-1">البنيان المرصوص</p>
            </div>
        </div>
        <div id="headerBookBadge" class="bg-blue-900/5 text-[#0056b3] text-[10px] font-black px-3 py-1.5 rounded-full border border-blue-100/50">
            بانتظار اختيار الدفتر...
        </div>
    </header>

    <main class="flex-grow p-5 space-y-6 max-w-md mx-auto w-full animate-slide-up">
        
        <!-- Main Form Card -->
        <section class="bg-white p-6 rounded-[32px] shadow-[0_20px_40px_-12px_rgba(0,86,179,0.06)] border border-blue-50/50 space-y-6">
            
            <form id="receiptForm" class="space-y-5">
                
                <!-- Subscriber Lookup -->
                <div class="space-y-1.5 relative">
                    <label class="text-xs font-black text-[#0056b3] mr-3 uppercase tracking-widest">اسم المساهم</label>
                    <div class="relative group">
                        <input type="text" id="subscriberName" placeholder="ابحث عن الاسم أو أضف جديداً..." 
                               class="w-full bg-[#f8faff] text-[#1a1c1e] border-2 border-transparent rounded-[20px] py-4 pr-4 pl-12 focus:border-blue-200 focus:bg-white focus:ring-0 font-bold transition-all placeholder:font-normal placeholder:text-blue-900/20"
                               required autocomplete="off">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center text-blue-900/20">
                            <span class="material-symbols-outlined" id="searchIcon">search</span>
                        </div>
                    </div>
                    <!-- Suggest Box -->
                    <div id="suggestBox" class="absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-blue-50 z-[100] hidden overflow-hidden divide-y divide-blue-50"></div>
                </div>

                <!-- Book Selection -->
                <div class="space-y-1.5">
                    <label class="text-xs font-black text-[#0056b3] mr-3 uppercase tracking-widest">اختيار الدفتر</label>
                    <select id="bookSelect" class="w-full bg-[#f8faff] text-[#1a1c1e] border-2 border-transparent rounded-[20px] py-4 px-4 focus:border-blue-200 focus:bg-white focus:ring-0 font-bold transition-all appearance-none" required>
                        <option value="">جاري تحميل الدفاتر...</option>
                    </select>
                </div>

                <!-- Serial & Date Row -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-black text-[#0056b3] mr-3 uppercase tracking-widest">رقم الوصل</label>
                        <input type="number" id="receiptNumber" placeholder="تلقائي..." 
                               class="w-full bg-blue-50/50 text-[#0056b3] border-transparent rounded-[18px] py-4 px-4 font-black transition-all text-center pointer-events-none"
                               readonly required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-black text-[#0056b3] mr-3 uppercase tracking-widest">تاريخ الوصل</label>
                        <input type="date" id="receiptDate" 
                               class="w-full bg-[#f8faff] text-[#1a1c1e] border-2 border-transparent rounded-[18px] py-4 px-4 focus:border-blue-200 focus:bg-white focus:ring-0 font-bold transition-all"
                               required>
                    </div>
                </div>

                <!-- Amount Section -->
                <div class="space-y-4 pt-2">
                    <div class="flex items-center justify-between px-3">
                        <label class="text-xs font-black text-[#0056b3] uppercase tracking-widest">المبلغ (د.ع)</label>
                        <span id="amountWords" class="text-[10px] font-bold text-blue-900/30">حدد المبلغ...</span>
                    </div>
                    
                    <!-- Presets -->
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setAmount(5000)" class="preset-btn bg-[#f8faff] text-[#0056b3] font-black py-3 rounded-xl border border-blue-100/30 active:scale-95 transition-all">5,000</button>
                        <button type="button" onclick="setAmount(10000)" class="preset-btn bg-[#f8faff] text-[#0056b3] font-black py-3 rounded-xl border border-blue-100/30 active:scale-95 transition-all">10,000</button>
                        <button type="button" onclick="setAmount(25000)" class="preset-btn bg-[#f8faff] text-[#0056b3] font-black py-3 rounded-xl border border-blue-100/30 active:scale-95 transition-all">25,000</button>
                    </div>

                    <!-- Custom Input -->
                    <div class="relative">
                        <input type="number" id="amount" placeholder="أدخل مبلغاً آخر..." 
                               class="w-full bg-blue-50 text-[#0056b3] text-center border-transparent rounded-[24px] py-6 focus:ring-2 focus:ring-blue-100 text-3xl font-black transition-all"
                               min="250" step="250" required>
                        <span class="absolute left-6 top-1/2 -translate-y-1/2 text-blue-900/10 font-black">د.ع</span>
                    </div>
                </div>

                <!-- Submit Action -->
                <button type="submit" class="w-full bg-[#0056b3] text-white font-black py-4 rounded-[24px] shadow-xl shadow-blue-700/20 active:scale-95 transition-all flex items-center justify-center gap-3 text-lg group mt-4">
                    <span class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">cloud_done</span>
                    <span>رفع الوصل الآن</span>
                </button>

            </form>
        </section>

        <!-- Dynamic Guidance Note -->
        <div id="guidanceNote" class="bg-blue-50/50 rounded-2xl p-4 flex gap-3 border border-blue-100/30 animate-pulse">
            <span class="material-symbols-outlined text-[#0056b3] text-xl">verified_user</span>
            <p class="text-[#0056b3] text-[9px] font-black leading-relaxed flex-grow">
                يرجى التأكد من مطابقة تاريخ الوصل الورقي مع التاريخ المختار هنا لضمان دقة التقارير الشهرية.
            </p>
        </div>

    </main>

    <!-- Premium Toast System -->
    <div id="toastNotification" class="fixed bottom-8 left-6 right-6 flex items-center justify-between bg-[#1a1c1e] text-white px-5 py-4 rounded-2xl shadow-2xl z-[200] opacity-0 translate-y-20 transition-all duration-500 pointer-events-none">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-green-400" id="toastIcon">check_circle</span>
            <span id="toastMessage" class="font-bold text-sm">تمت العملية بنجاح</span>
        </div>
        <button onclick="location.reload()" class="text-xs bg-white/10 px-3 py-1.5 rounded-lg font-black uppercase tracking-tighter">إغلاق</button>
    </div>

    <script type="module">
        import { supabase } from './lib/supabase.js';
        import { notify } from './lib/notifications.js';

        const form = document.getElementById('receiptForm');
        const subscriberNameInput = document.getElementById('subscriberName');
        const suggestBox = document.getElementById('suggestBox');
        const amountInput = document.getElementById('amount');
        const headerBookBadge = document.getElementById('headerBookBadge');
        const bookSelect = document.getElementById('bookSelect');
        const toastNotification = document.getElementById('toastNotification');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        let currentUser = null;
        let userProfile = null;
        let openBooks = [];

        async function loadBooks(autoSelect = true) {
            const { data: books, error } = await supabase
                .from('books')
                .select('*')
                .eq('ally_id', currentUser.id)
                .eq('status', 'open')
                .is('received_date', null);
                
            if (error) { console.error(error); notify('خطأ', 'فشل تحميل البيانات', { toast: true, native: false, type: 'error' }); }

            openBooks = books || [];
            if (openBooks.length === 0) {
                bookSelect.innerHTML = '<option value="">لا يوجد لديك دفتر حاليا</option>';
                receiptNumberInput.value = '';
                headerBookBadge.textContent = 'لا توجد دفاتر نشطة';
                headerBookBadge.className = "bg-red-50 text-red-700 text-[10px] font-black px-3 py-1.5 rounded-full border border-red-100";
            } else {
                const currentVal = bookSelect.value;
                bookSelect.innerHTML = '<option value="">اختر الدفتر...</option>' + 
                    openBooks.map(b => `<option value="${b.id}" data-serial="${b.serial_number}" data-count="${b.receipt_count}" data-month="${b.month_year || ''}">${b.book_name} (${b.month_year || 'بلا تاريخ'})</option>`).join('');
                
                if (autoSelect) {
                    const targetBookId = currentVal || localStorage.getItem('lastSelectedBookId');
                    if (targetBookId && openBooks.some(b => b.id === targetBookId)) {
                        bookSelect.value = targetBookId;
                        await updateBookSequence(targetBookId);
                    }
                }
            }
        }

        // Init Session & Books
        document.addEventListener('DOMContentLoaded', async () => {
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('receiptDate').value = today;
            
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;

            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
            userProfile = profile;

            await loadBooks(true);
        });

        // Search Lookup
        subscriberNameInput.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length > 2) {
                document.getElementById('searchIcon').textContent = 'sync';
                
                const { data } = await supabase
                    .from('receipts')
                    .select('subscriber_name, receipt_date, created_at')
                    .ilike('subscriber_name', `%${query}%`)
                    .order('created_at', { ascending: false })
                    .limit(20);

                if (data && data.length > 0) {
                    const uniqueSubscribers = [];
                    const seenNames = new Set();
                    
                    for (const row of data) {
                        if (!seenNames.has(row.subscriber_name)) {
                            seenNames.add(row.subscriber_name);
                            uniqueSubscribers.push({
                                name: row.subscriber_name,
                                date: row.receipt_date || row.created_at
                            });
                            if (uniqueSubscribers.length >= 5) break;
                        }
                    }

                    suggestBox.innerHTML = uniqueSubscribers.map(sub => `
                        <div class="px-5 py-3 hover:bg-blue-50 cursor-pointer transition-colors flex items-center justify-between" onclick="window.selectName('${sub.name}')">
                            <div class="flex flex-col">
                                <span class="font-bold text-[#0056b3]">${sub.name}</span>
                                <span class="text-[10px] font-bold text-blue-900/40">آخر مساهمة: ${new Date(sub.date).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                            </div>
                            <span class="material-symbols-outlined text-blue-900/10 text-sm">history</span>
                        </div>
                    `).join('');
                    suggestBox.classList.remove('hidden');
                } else { suggestBox.classList.add('hidden'); }
                document.getElementById('searchIcon').textContent = 'search';
            } else { suggestBox.classList.add('hidden'); }
        });

        window.selectName = (name) => {
            subscriberNameInput.value = name;
            suggestBox.classList.add('hidden');
        };

        window.setAmount = (val) => {
            amountInput.value = val;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.replace('bg-[#0056b3]', 'bg-[#f8faff]'));
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.replace('text-white', 'text-[#0056b3]'));
            if (window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.replace('bg-[#f8faff]', 'bg-[#0056b3]');
                window.event.currentTarget.classList.replace('text-[#0056b3]', 'text-white');
            }
        };

        const receiptNumberInput = document.getElementById('receiptNumber');

        async function updateBookSequence(id) {
            if (!id) {
                receiptNumberInput.value = '';
                headerBookBadge.textContent = 'بانتظار اختيار الدفتر...';
                headerBookBadge.className = "bg-blue-900/5 text-[#0056b3] text-[10px] font-black px-3 py-1.5 rounded-full border border-blue-100/50";
                return false;
            }

            const opt = bookSelect.querySelector(`option[value="${id}"]`);
            if (!opt) {
                receiptNumberInput.value = '';
                headerBookBadge.textContent = 'بانتظار اختيار الدفتر...';
                headerBookBadge.className = "bg-blue-900/5 text-[#0056b3] text-[10px] font-black px-3 py-1.5 rounded-full border border-blue-100/50";
                return false;
            }
            const start = parseInt(opt.getAttribute('data-serial')) || 1;
            
            try {
                let count = 0;
                let next = start;
                
                if (navigator.onLine) {
                    const { count: dbCount, error: countError } = await supabase
                        .from('receipts')
                        .select('*', { count: 'exact', head: true })
                        .eq('book_id', id);
                        
                    if (countError) throw countError;
                    count = dbCount || 0;
                    
                    const { data } = await supabase
                        .from('receipts')
                        .select('receipt_number')
                        .eq('book_id', id)
                        .order('receipt_number', { ascending: false })
                        .limit(1)
                        .maybeSingle();
                    
                    next = data ? (data.receipt_number + 1) : start;
                } else {
                    const baseCount = parseInt(opt.getAttribute('data-count')) || 0;
                    const queue = JSON.parse(localStorage.getItem('offlineReceiptsQueue') || '[]');
                    const queuedReceipts = queue.filter(r => r.book_id === id);
                    
                    count = baseCount + queuedReceipts.length;
                    
                    if (queuedReceipts.length > 0) {
                        const maxQueuedNum = Math.max(...queuedReceipts.map(r => r.receipt_number));
                        next = maxQueuedNum + 1;
                    } else {
                        next = start + baseCount;
                    }
                }
                
                if (count >= 50) {
                    await notify('تم اكتمال الدفتر', 'اكتمل هذا الدفتر وبلغ 50 وصلاً! يرجى اختيار دفتر جديد لمتابعة التسجيل.', { native: true, toast: true, type: 'warning' });
                    bookSelect.value = '';
                    receiptNumberInput.value = '';
                    headerBookBadge.textContent = 'الدفتر مكتمل (50 وصلاً)';
                    headerBookBadge.className = "bg-red-50 text-red-700 text-[10px] font-black px-3 py-1.5 rounded-full border border-red-100";
                    localStorage.removeItem('lastSelectedBookId');
                    await loadBooks(false);
                    return false;
                }
                
                receiptNumberInput.value = next;
                headerBookBadge.textContent = `الوصل القادم: #${next}`;
                headerBookBadge.className = "bg-green-50 text-green-700 text-[10px] font-black px-3 py-1.5 rounded-full border border-green-100";
                return true;
            } catch (err) { 
                console.error(err);
                notify('خطأ', 'فشل في جلب تسلسل الوصل القادم', { toast: true, native: false, type: 'error' });
                return false;
            }
        }

        bookSelect.addEventListener('change', async (e) => {
            const id = e.target.value;
            if (id) {
                localStorage.setItem('lastSelectedBookId', id);
            } else {
                localStorage.removeItem('lastSelectedBookId');
            }
            await updateBookSequence(id);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalBtnContent = btn.innerHTML;
            
            const rNum = parseInt(receiptNumberInput.value);
            if (!bookSelect.value) { 
                await notify('تنبيه', 'يرجى اختيار الدفتر أولاً', { native: false, toast: true, type: 'warning' });
                return; 
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span>';
            
            try {
                let count = 0;
                if (navigator.onLine) {
                    const { count: dbCount, error: countError } = await supabase
                        .from('receipts')
                        .select('*', { count: 'exact', head: true })
                        .eq('book_id', bookSelect.value);
                    
                    if (countError) throw countError;
                    count = dbCount || 0;
                } else {
                    const opt = bookSelect.selectedOptions[0];
                    const baseCount = parseInt(opt.getAttribute('data-count')) || 0;
                    const queue = JSON.parse(localStorage.getItem('offlineReceiptsQueue') || '[]');
                    const queuedCount = queue.filter(r => r.book_id === bookSelect.value).length;
                    
                    count = baseCount + queuedCount;
                }

                if (count >= 50) {
                    await notify('تم اكتمال الدفتر', 'لا يمكن تسجيل وصولات جديدة في هذا الدفتر لأنه مكتمل ويحتوي على 50 وصلاً بالفعل.', { native: true, toast: true, type: 'error' });
                    bookSelect.value = '';
                    receiptNumberInput.value = '';
                    headerBookBadge.textContent = 'الدفتر مكتمل (50 وصلاً)';
                    headerBookBadge.className = "bg-red-50 text-red-700 text-[10px] font-black px-3 py-1.5 rounded-full border border-red-100";
                    localStorage.removeItem('lastSelectedBookId');
                    btn.disabled = false;
                    btn.innerHTML = originalBtnContent;
                    return;
                }

                const receiptData = {
                    book_id: bookSelect.value,
                    ally_id: currentUser.id,
                    subscriber_name: subscriberNameInput.value,
                    receipt_number: rNum,
                    amount: parseInt(amountInput.value),
                    month_year: bookSelect.selectedOptions[0]?.getAttribute('data-month') || new Date().toISOString().substring(0, 7),
                    receipt_date: document.getElementById('receiptDate').value
                };

                if (!navigator.onLine) {
                    throw new Error('Offline');
                }

                const { data: insertedData, error } = await supabase
                    .from('receipts')
                    .insert(receiptData)
                    .select()
                    .single();

                if (error) throw error;

                const successMsg = `تم حفظ وصل بقيمة ${parseInt(amountInput.value).toLocaleString()} د.ع للمساهم ${subscriberNameInput.value} بنجاح!`;

                await notify('تم تسجيل الوصل', successMsg, { native: true, toast: true, type: 'success' });
                
                await resetForm(true);
            } catch (err) {
                console.error(err);
                if (err.message === 'Offline' || err.message === 'Failed to fetch') {
                    const receiptData = {
                        book_id: bookSelect.value,
                        ally_id: currentUser.id,
                        subscriber_name: subscriberNameInput.value,
                        receipt_number: rNum,
                        amount: parseInt(amountInput.value),
                        month_year: bookSelect.selectedOptions[0]?.getAttribute('data-month') || new Date().toISOString().substring(0, 7),
                        receipt_date: document.getElementById('receiptDate').value
                    };

                    // Save to offline queue
                    const queue = JSON.parse(localStorage.getItem('offlineReceiptsQueue') || '[]');
                    queue.push(receiptData);
                    localStorage.setItem('offlineReceiptsQueue', JSON.stringify(queue));

                    await notify('حفظ محلي (بدون إنترنت)', `تم حفظ الوصل محلياً بنجاح.`, { native: true, toast: true, type: 'warning' });
                    
                    await resetForm(true);
                } else {
                    await notify('خطأ في العملية', err.message, { native: false, toast: true, type: 'error' });
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        });

        async function resetForm(keepBook = true) {
            // 1. Clear subscriber input and suggestions
            subscriberNameInput.value = '';
            suggestBox.innerHTML = '';
            suggestBox.classList.add('hidden');
            
            // 2. Clear amount and reset preset buttons
            amountInput.value = '';
            const amountWords = document.getElementById('amountWords');
            if (amountWords) amountWords.textContent = 'حدد المبلغ...';
            document.querySelectorAll('.preset-btn').forEach(b => {
                b.classList.remove('bg-[#0056b3]', 'text-white');
                b.classList.add('bg-[#f8faff]', 'text-[#0056b3]');
            });
            
            // 3. Keep current date intact
            if (!document.getElementById('receiptDate').value) {
                document.getElementById('receiptDate').value = new Date().toISOString().slice(0, 10);
            }

            // 4. Handle book retention and update next receipt number or handle full book
            const currentBookId = bookSelect.value;
            if (keepBook && currentBookId) {
                await updateBookSequence(currentBookId);
            } else {
                bookSelect.value = '';
                receiptNumberInput.value = '';
                headerBookBadge.textContent = 'بانتظار اختيار الدفتر...';
                headerBookBadge.className = "bg-blue-900/5 text-[#0056b3] text-[10px] font-black px-3 py-1.5 rounded-full border border-blue-100/50";
                localStorage.removeItem('lastSelectedBookId');
            }
            
            // 5. Refocus subscriber input for speedy entry
            subscriberNameInput.focus();
        }
    </script>
</body>
</html>
